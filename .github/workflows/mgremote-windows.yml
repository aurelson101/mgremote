name: MGRemote Windows MSI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runner: windows-2025
          - platform: arm64
            runner: windows-11-vs2026-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Verify native build architecture
        shell: pwsh
        run: |
          $actual = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString().ToLowerInvariant()
          if ($actual -ne '${{ matrix.platform }}') { throw "Expected native ${{ matrix.platform }} host, found $actual" }
          dotnet --info
      - name: Build and validate Windows MSI
        shell: pwsh
        run: ./Tools/Build-MGRemotePackage.ps1 -Platform ${{ matrix.platform }} -Version 0.1.17
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mgremote-windows-${{ matrix.platform }}-0.1.17
          path: |
            artifacts/installers/0.1.17/**/*
            artifacts/*verification.json
            artifacts/gui-*.png
          if-no-files-found: warn
